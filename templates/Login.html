<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión - Rentec</title>

    <link rel="icon"
          href="{{ url_for('static', filename='imagenes/LOGO.jpeg') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='diseños.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>


<body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <header class="header">

        <img
            src="{{ url_for('static', filename='imagenes/LOGO.jpeg') }}"
            alt="Logo de Rentec"
            class="logo"
        >

        <nav class="nav">

            <ul>

                <li>
                    <a href="{{ url_for('inicio') }}">
                        Página principal
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('nosotros') }}">
                        Quiénes somos
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('mision') }}">
                        Misión y visión
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('login_registro') }}">
                        Registro/Login
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <br>

    <section class="Login">

        <h1>
            INICIO DE SESIÓN
        </h1>

    </section>

    <section class="Login2">

        <form
            class="login-form"
            method="POST"
            action="{{ url_for('login') }}"
        >

            <!-- USUARIO -->

            <label for="usuario">
                Usuario
            </label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Ingresa tu usuario"
                required
            >


            <br>
            <br>

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                required
            >


            <br>
            <br>

            <button
                class="button"
                type="submit"
            >
                Ingresar
            </button>


        </form>

    </section>


    <br>

    <footer class="footer">

        <p>
            &copy; Rentec 2026 GBM
            Conformada por Gabriel, Sharon, Julian y Joseph
            Hecho en el Colegio Gabriel Betancourt Mejía
        </p>

    </footer>


</body>

</html>
