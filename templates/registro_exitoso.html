

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="3;url=/">

    <title>Registro exitoso - Rentec</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .mensaje {
            background: white;
            width: 380px;
            padding: 35px;

            border-radius: 15px;
            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

            animation: aparecer 0.5s ease;
        }

        .icono {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #22c55e;
            color: white;

            font-size: 40px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2 {
            color: #1f2937;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            margin: 0;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }
    </style>
</head>

<body>

    <div class="mensaje">

        <div class="icono">
            ✓
        </div>

        <h2>¡Registro exitoso!</h2>

        <p>
            Tu cuenta ha sido creada correctamente.
        </p>

    </div>

</body>
</html>
