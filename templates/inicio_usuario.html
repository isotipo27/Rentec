<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio - Rentec</title>

    <link rel="icon"
          href="{{ url_for('static', filename='imagenes/LOGO.jpeg') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='diseños.css') }}">

</head>


<body>


    <!-- =========================
         MENÚ
    ========================== -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <!-- LOGO / NOMBRE -->

            <a class="navbar-brand"
               href="{{ url_for('inicio_usuario') }}">

                Rentec

            </a>


            <!-- BOTONES -->

            <div>

                <!-- Volver al INDEX -->

                <a href="{{ url_for('inicio') }}"
                   class="btn btn-outline-light me-2">

                    Inicio

                </a>


                <!-- Cerrar sesión -->

                <a href="{{ url_for('logout') }}"
                   class="btn btn-danger">

                    Cerrar sesión

                </a>

            </div>

        </div>

    </nav>



    <!-- =========================
         BIENVENIDA
    ========================== -->

    <div class="container mt-5">

        <div class="text-center">

            <h1>
                ¡Bienvenido a Rentec!
            </h1>


            <h3 class="mt-3">

                Hola, {{ nombre }}

            </h3>

        </div>

        <!-- =========================
             PANEL ADMINISTRADOR
        ========================== -->

{% if session.get('rol') == 'Administrador' %}

<div class="mt-5 p-4 border rounded text-center">

    <h3>
        ⚙️ Administración
    </h3>

    <p>
        Tienes permisos de administrador.
    </p>

    <a href="{{ url_for('administrador') }}"
       class="btn btn-danger">

        Panel de administrador

    </a>

</div>

{% endif %}

    </div>



    <!-- =========================
         PIE DE PÁGINA
    ========================== -->

    <footer class="text-center mt-5 p-4 bg-dark text-white">

        <p class="mb-0">

            © 2026 Rentec - Alquiler de equipos electrónicos

        </p>

    </footer>


</body>

</html>
